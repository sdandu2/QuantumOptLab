name: QuantumOptLab CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quantumoptlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Qiskit / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install research dependencies
        run: python -m pip install -e ".[research,dev]"
      - name: Run tests
        run: QUANTUMOPTLAB_PUBLIC_SOURCE=1 python -m pytest -q
      - name: Qiskit smoke run
        run: python -m quantumoptlab
      - name: Check repository hygiene
        run: python scripts/audit_repository.py
      - name: Export authentic quantum circuit drawings
        run: python web/scripts/export_qiskit_circuits.py

  website:
    name: React / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify research snapshot and build website
        run: npm run build
