[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumoptlab"
version = "0.1.0"
description = "Reproducible Qiskit QAOA and synthetic-noise optimization research"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{name = "QuantumOptLab contributors"}]
keywords = ["qiskit", "qaoa", "max-cut", "quantum-optimization", "transpilation"]
dependencies = [
  "numpy>=1.26,<3",
  "networkx>=3.2,<5",
  "scipy>=1.12,<2",
  "qiskit==2.6.2",
  "qiskit-aer==0.18.2",
]

[project.optional-dependencies]
research = [
  "pandas>=2.1,<4",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "ipykernel>=6.29,<8",
  "ipython>=8,<10",
  "jupyter>=1,<3",
  "nbformat>=5.9,<6",
]
dev = ["pytest>=8,<10", "nbformat>=5.9,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
